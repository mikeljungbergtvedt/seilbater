<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seilbåter</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">⛵ <span>Seilbåter</span> <span class="version" title="Siste endring">v0.5 — ScrapingBee: stealth_proxy (Cloudflare-bypass)</span></div>
    <div class="add-inline">
      <input id="newUrl" type="url" placeholder="Lim inn URL fra annonse (Finn, Yachtworld, Boat24…)" autocomplete="off" />
      <button id="addBtn" class="btn-primary">Legg til</button>
    </div>
  </div>
</header>

<main class="container">
  <div id="addStatus" class="add-status" hidden></div>

  <div class="listing-header">
    <div class="listing-count"><span id="countText">0 båter</span></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Søk…" value="" autocomplete="off" />
      <select id="statusFilter">
        <option value="all">Alle statuser</option>
        <option value="active">Aktive</option>
        <option value="sold">Solgte</option>
        <option value="reserved">Reserverte</option>
        <option value="removed">Fjernet</option>
      </select>
      <select id="sort">
        <option value="lastChangeAt-desc">Sist endret</option>
        <option value="addedAt-desc">Nyest lagt til</option>
        <option value="addedAt-asc">Eldst lagt til</option>
        <option value="price-asc">Pris: lav → høy</option>
        <option value="price-desc">Pris: høy → lav</option>
        <option value="title-asc">Tittel A → Å</option>
      </select>
    </div>
  </div>

  <div id="listings" class="listings"></div>
  <div id="loading" class="empty">Laster…</div>
</main>

<script src="/app.js"></script>
</body>
</html>
