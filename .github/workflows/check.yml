name: Daily check

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 Oslo sommertid / 06:00 vinter
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["boats.json"]

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run check
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: npm run check

      - name: Commit updated boats.json
        continue-on-error: true
        run: |
          if [[ -z "$(git status --porcelain boats.json)" ]]; then
            echo "Ingen endringer i boats.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boats.json
          git commit -m "chore: daily check $(date -u +%Y-%m-%d)"

          # Retry push med rebase — brukeren kan ha committet på main
          # via frontenden mens workflowen kjørte, som gir non-fast-forward.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push OK på forsøk $attempt"
              exit 0
            fi
            echo "Push feilet på forsøk $attempt — rebaser og prøver igjen"
            # Rebase vår commit over remote sin nye state
            git pull --rebase --autostash origin main || {
              echo "Rebase feilet — gir opp"
              exit 0  # ikke fail hele jobben; enricheringen skjer på neste kjøring
            }
            sleep $((attempt * 2))
          done
          echo "Ga opp å pushe etter 5 forsøk — enrichering vil skje neste kjøring"
          exit 0  # ikke fail jobben, unngå notifikasjonsspam
